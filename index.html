<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTMEX - Sistema de Etiquetas JAMA</title>
    <!-- Librerías requeridas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --area-color: #27ae60; --side-color: #27ae60; }
        body { font-family: 'Arial', sans-serif; background: #1a1a1d; color: #e0e0e0; margin: 0; padding: 20px; }
        .admin-panel { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; }
        .form-container { background: #25252b; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .preview-container { flex: 1.5; display: flex; flex-direction: column; align-items: center; }
        
        .header-title-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-admin-toggle { background: #8e44ad; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; flex: initial; }
        .btn-admin-toggle:hover { background: #9b59b6; }
        .admin-badge { font-size: 11px; background: #27ae60; color: white; padding: 2px 6px; border-radius: 3px; display: none; margin-left: 8px; vertical-align: middle; }

        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 8px; }
        label { font-size: 11px; color: #999; text-transform: uppercase; margin-bottom: 3px; }
        
        input, select { background: #121214; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; font-size: 13px; }
        input[readonly], select[disabled] { background: #1a1a1e; border-color: #333; color: #888; cursor: not-allowed; }
        input:not([readonly]), select:not([disabled]) { border-color: #f39c12; }

        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-preview { background: #3498db; color: white; }
        .btn-pdf { background: #e74c3c; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* DISEÑO EXACTO DE LA ETIQUETA */
        .kanban-render { 
            width: 800px; 
            background: white; 
            color: black; 
            display: flex; 
            flex-direction: column; 
            border: 2px solid black; 
            margin-top: 20px; 
            box-sizing: border-box;
        }
        .header-row { display: flex; background: var(--area-color); border-bottom: 2px solid black; align-items: stretch; }
        .header-cell { flex: 1; border-right: 1px solid black; padding: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .header-cell:last-child { border-right: none; }
        .header-cell span { display: block; font-size: 10px; font-weight: normal; }
        .header-cell div { font-weight: bold; font-size: 16px; min-height: 20px; }
        .proc-highlight div { font-size: 20px !important; }
        .arrow-cell { display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; padding: 0 6px; border-right: 1px solid black; }

        .body-row { display: flex; height: 210px; }
        .left-panel { width: 38%; display: flex; flex-direction: column; background: var(--side-color); border-right: 2px solid black; }
        .side-field { flex: 1; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid black; font-weight: bold; position: relative; }
        .side-field:last-child { border-bottom: none; }
        
        /* TEXTOS VERTICALES IZQUIERDOS */
        .side-field::before { 
            content: attr(data-label); 
            position: absolute; 
            left: 4px; 
            top: 50%;
            transform: translateY(-50%) rotate(-90deg); 
            font-size: 8px; 
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .val-large { font-size: 38px; }
        .val-mid { font-size: 26px; }

        .right-panel { width: 62%; display: flex; }
        .img-area { flex: 1; padding: 8px; display: flex; align-items: center; justify-content: center; position: relative; border-right: 1px solid black; }
        .img-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .tekin-label { position: absolute; bottom: 4px; right: 4px; border: 1px solid black; background: white; padding: 1px 8px; font-weight: bold; font-size: 16px; }
        
        .qr-area { width: 115px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; }
        .seq-box { font-weight: bold; font-size: 20px; border: 1px solid black; width: 85px; text-align: center; background: #eee; margin-bottom: 8px; padding: 2px 0; }
        
        .status-cloud { font-size: 11px; margin-left: 8px; font-weight: bold; }
        #pdf-progress { margin-top: 10px; font-weight: bold; color: #f39c12; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

<div class="admin-panel">
    <div class="form-container">
        <div class="header-title-container">
            <h2 style="margin:0; color:#3498db">
                KTMEX | Label System 
                <span id="admin-badge" class="admin-badge">ADMIN</span>
            </h2>
            <button class="btn-admin-toggle" onclick="toggleAdminMode()">Modo Admin 🔒</button>
        </div>
        
        <div class="grid-inputs">
            <div class="form-group full-width">
                <label>Sebango <span id="cloud-status" class="status-cloud"></span></label>
                <input type="text" id="sebango" style="border: 2px solid #3498db; font-weight: bold; font-size: 16px; text-transform: uppercase;" placeholder="Escribir Sebango">
            </div>

            <div class="form-group full-width">
                <label>Área de Kanban</label>
                <select id="area" disabled onchange="updateColors()">
                    <option value="#27ae60">Producto Terminado (Verde)</option>
                    <option value="#FFFF00">Subensamble (Amarillo)</option>
                    <option value="#FFC0CB">Estampado (Rosa)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Lado (Side Color)</label>
                <select id="side" disabled onchange="updateColors()">
                    <option value="#27ae60">RH (Verde)</option>
                    <option value="#FFFF00">LH (Amarillo)</option>
                    <option value="#333333">NA (Negro)</option>
                </select>
            </div>
            <div class="form-group"><label>Tekin</label><input type="text" id="tekin" readonly></div>
            
            <div class="form-group"><label>Secuencia Inicio</label><input type="number" id="seqStart" value="1"></div>
            <div class="form-group"><label>Secuencia Fin</label><input type="number" id="seqEnd" value="300"></div>
            
            <div class="form-group"><label>Proceso Previo</label><input type="text" id="prevProc" readonly></div>
            <div class="form-group"><label>Siguiente Proceso</label><input type="text" id="nextProc" readonly></div>
            <div class="form-group"><label>Empaque</label><input type="text" id="pack" readonly></div>
            <div class="form-group"><label>QPC (Cantidad)</label><input type="text" id="qpc" readonly></div>
            <div class="form-group"><label>ID Cliente</label><input type="text" id="clientId" readonly></div>
            <div class="form-group full-width"><label># de Parte</label><input type="text" id="pno" readonly></div>
            <div class="form-group full-width"><label>Cliente Final</label><input type="text" id="client" readonly></div>
        </div>

        <div class="btn-group">
            <button class="btn-preview" onclick="renderPreview(document.getElementById('seqStart').value)">Vista Previa</button>
            <button class="btn-pdf" id="btn-pdf" onclick="generateExactPDF()">Generar PDF</button>
        </div>
        <div id="pdf-progress"></div>
    </div>

    <div class="preview-container">
        <h3 style="color:#999">VISTA PREVIA</h3>
        <div id="kanban-box" class="kanban-render"></div>
    </div>
</div>

<script>
    let productImg = "";
    const SHEET_ID = "1GkWY2r-kz_wfv_-LPEeFEdKe1qNILTV86pln2xg_rIM";
    const ADMIN_PASS = "pcpc2026ktmex";
    let isAdmin = false;

    function toggleAdminMode() {
        if (!isAdmin) {
            const pass = prompt("Ingrese la contraseña de Administrador:");
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                enableAdminFields(true);
                alert("🔓 Modo Administrador activado. Todos los campos están desbloqueados.");
            } else if (pass !== null) {
                alert("❌ Contraseña incorrecta.");
            }
        } else {
            isAdmin = false;
            enableAdminFields(false);
            alert("🔒 Modo Administrador desactivado.");
        }
    }

    function enableAdminFields(enable) {
        const fieldsToToggle = ['area', 'side', 'tekin', 'prevProc', 'nextProc', 'pack', 'qpc', 'clientId', 'pno', 'client'];
        
        fieldsToToggle.forEach(id => {
            const el = document.getElementById(id);
            if (el.tagName === "SELECT") {
                el.disabled = !enable;
            } else {
                el.readOnly = !enable;
            }
        });

        const badge = document.getElementById('admin-badge');
        const btnToggle = document.querySelector('.btn-admin-toggle');

        if (enable) {
            badge.style.display = "inline-block";
            btnToggle.innerText = "Salir Admin 🔓";
            btnToggle.style.background = "#27ae60";
        } else {
            badge.style.display = "none";
            btnToggle.innerText = "Modo Admin 🔒";
            btnToggle.style.background = "#8e44ad";
        }
    }

    function mapAreaColor(akanVal) {
        const val = String(akanVal).trim();
        if (val === "3") return "#27ae60"; 
        if (val === "2") return "#FFFF00"; 
        if (val === "1") return "#FFC0CB"; 
        return "#27ae60";
    }

    function mapSideColor(ladoVal) {
        const val = String(ladoVal).trim().toUpperCase();
        if (val === "RH") return "#27ae60"; 
        if (val === "LH") return "#FFFF00"; 
        if (val === "NA") return "#333333"; 
        return "#27ae60";
    }

    async function processDriveImage(rawUrl) {
        if (!rawUrl) return "";
        if (rawUrl.startsWith("data:image")) return rawUrl;

        let fileId = "";
        const matchD = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        const matchId = rawUrl.match(/id=([a-zA-Z0-9_-]+)/);

        if (matchD && matchD[1]) fileId = matchD[1];
        else if (matchId && matchId[1]) fileId = matchId[1];
        else if (rawUrl.length > 20 && !rawUrl.includes("http")) fileId = rawUrl.trim();

        if (fileId) {
            return `https://lh3.googleusercontent.com/d/${fileId}=s1000`;
        }
        return rawUrl;
    }

    function fetchDatabaseBySebango(targetSebango) {
        const statusEl = document.getElementById('cloud-status');
        if (!targetSebango) return;

        statusEl.style.color = "#3498db";
        statusEl.innerText = "⏳ Consultando...";

        const oldScript = document.getElementById('gviz-jsonp-script');
        if (oldScript) oldScript.remove();

        window.handleGvizResponse = async function(response) {
            try {
                if (!response || !response.table) throw new Error("Respuesta inválida de Google Sheets");

                const table = response.table;
                let headers = table.cols.map(c => (c.label || c.id || "").toString().trim().toUpperCase());
                
                let dataMatrix = table.rows.map(r => 
                    r.c ? r.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : "") : []
                );

                let sebangoColIdx = headers.findIndex(h => h.includes("SEBANGO"));
                
                if (sebangoColIdx === -1) {
                    for (let i = 0; i < dataMatrix.length; i++) {
                        const rowUpper = dataMatrix[i].map(x => x.toUpperCase());
                        const idx = rowUpper.findIndex(x => x.includes("SEBANGO"));
                        if (idx !== -1) {
                            headers = rowUpper;
                            sebangoColIdx = idx;
                            dataMatrix = dataMatrix.slice(i + 1);
                            break;
                        }
                    }
                }

                if (sebangoColIdx === -1) throw new Error(`Columna 'SEBANGO' no encontrada.`);

                const getColIndex = (colName) => {
                    const target = colName.toUpperCase();
                    return headers.findIndex(h => h === target || h.trim() === target || h.includes(target));
                };

                const match = dataMatrix.find(r => 
                    r[sebangoColIdx] && String(r[sebangoColIdx]).trim().toUpperCase() === targetSebango.trim().toUpperCase()
                );

                if (match) {
                    const getVal = (colName) => {
                        const idx = getColIndex(colName);
                        return (idx !== -1 && match[idx] !== undefined) ? String(match[idx]) : "";
                    };

                    document.getElementById('area').value = mapAreaColor(getVal("AKAN"));
                    document.getElementById('side').value = mapSideColor(getVal("LADO"));
                    document.getElementById('tekin').value = getVal("TEKIN");
                    document.getElementById('prevProc').value = getVal("PP");
                    document.getElementById('nextProc').value = getVal("SP");
                    document.getElementById('pack').value = getVal("EMP");
                    document.getElementById('qpc').value = getVal("QPC");
                    document.getElementById('clientId').value = getVal("IDC");
                    document.getElementById('pno').value = getVal("NP");
                    document.getElementById('client').value = getVal("CF");

                    const imgRawVal = getVal("IMG");
                    if (imgRawVal && imgRawVal.trim() !== "") {
                        productImg = await processDriveImage(imgRawVal.trim());
                    } else {
                        productImg = "";
                    }

                    statusEl.style.color = "#2ecc71";
                    statusEl.innerText = "Datos Cargados";
                    updateColors();
                } else {
                    statusEl.style.color = "#e67e22";
                    statusEl.innerText = `⚠️ '${targetSebango}' No encontrado. Para,Llama y Espera!`;
                }
            } catch (err) {
                console.error("Error al procesar:", err);
                statusEl.style.color = "#e74c3c";
                statusEl.innerText = `❌ ${err.message}`;
            }
        };

        const script = document.createElement('script');
        script.id = 'gviz-jsonp-script';
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleGvizResponse`;
        document.body.appendChild(script);
    }

    const sebangoInput = document.getElementById('sebango');
    sebangoInput.addEventListener('input', (e) => {
        const start = e.target.selectionStart;
        const end = e.target.selectionEnd;
        e.target.value = e.target.value.toUpperCase();
        e.target.setSelectionRange(start, end);
    });
    sebangoInput.addEventListener('change', (e) => fetchDatabaseBySebango(e.target.value));
    sebangoInput.addEventListener('blur', (e) => fetchDatabaseBySebango(e.target.value));

    // Eventos para refrescar vista previa al escribir manualmente en Modo Admin
    const editableInputs = ['tekin', 'prevProc', 'nextProc', 'pack', 'qpc', 'clientId', 'pno', 'client'];
    editableInputs.forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => renderPreview(document.getElementById('seqStart').value));
    });

    function updateColors() {
        document.documentElement.style.setProperty('--area-color', document.getElementById('area').value);
        document.documentElement.style.setProperty('--side-color', document.getElementById('side').value);
        renderPreview(document.getElementById('seqStart').value);
    }

    function renderPreview(currentSeq) {
        const box = document.getElementById('kanban-box');
        const sideVal = document.getElementById('side').value;
        const textColor = sideVal === "#333333" ? "white" : "black";

        box.innerHTML = `
            <div class="header-row">
                <div class="header-cell proc-highlight"><span>Proceso Previo</span><div>${document.getElementById('prevProc').value}</div></div>
                <div class="arrow-cell">➔</div>
                <div class="header-cell proc-highlight"><span>Siguiente Proceso</span><div>${document.getElementById('nextProc').value}</div></div>
                <div class="header-cell"><span>Empaque</span><div>${document.getElementById('pack').value}</div></div>
                <div class="header-cell"><span>QPC</span><div>${document.getElementById('qpc').value}</div></div>
                <div class="header-cell"><span>Cliente</span><div>${document.getElementById('client').value}</div></div>
            </div>
            <div class="body-row">
                <div class="left-panel" style="color: ${textColor}">
                    <div class="side-field val-large" data-label="KTMEX">${document.getElementById('sebango').value}</div>
                    <div class="side-field val-mid" data-label="# PARTE">${document.getElementById('pno').value}</div>
                    <div class="side-field val-large" data-label="CLIENTE">${document.getElementById('clientId').value}</div>
                </div>
                <div class="right-panel">
                    <div class="img-area">
                        ${productImg ? `<img src="${productImg}" crossorigin="anonymous" id="preview-img-obj">` : '<span>Sin Imagen</span>'}
                        <div class="tekin-label">${document.getElementById('tekin').value}</div>
                    </div>
                    <div class="qr-area">
                        <div class="seq-box" id="seq-val-target">${currentSeq}</div>
                        <div id="qr-target-element"></div>
                    </div>
                </div>
            </div>
        `;

        const qrContainer = document.getElementById('qr-target-element');
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
            text: `${currentSeq}-${document.getElementById('pno').value}-${document.getElementById('sebango').value}`,
            width: 90,
            height: 90,
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    // GENERADOR ULTRA RÁPIDO MANTENIENDO EL DISEÑO Y DIMENSIONES
    async function generateExactPDF() {
        const btnPdf = document.getElementById('btn-pdf');
        const progressEl = document.getElementById('pdf-progress');
        const start = parseInt(document.getElementById('seqStart').value);
        const end = parseInt(document.getElementById('seqEnd').value);

        if (isNaN(start) || isNaN(end) || start > end) {
            alert("Rango de secuencia no válido.");
            return;
        }

        btnPdf.disabled = true;
        progressEl.innerText = "⚡ Generando plantilla base en alta resolución...";

        const { jsPDF } = window.jspdf;
        // Formato Carta: 215.9 mm (ancho) x 279.4 mm (alto)
        const pdf = new jsPDF('p', 'mm', 'letter');
        const kanbanBox = document.getElementById('kanban-box');

        // Renderizar vista previa base con secuencia plantilla
        renderPreview(start);

        const imgObj = document.getElementById('preview-img-obj');
        if (imgObj && !imgObj.complete) {
            await new Promise(res => imgObj.onload = res);
        }

        // Obtener la posición de la zona del QR/secuencia dentro de la etiqueta
        const qrAreaEl = kanbanBox.querySelector('.qr-area');
        const boxRect = kanbanBox.getBoundingClientRect();
        const qrRect = qrAreaEl.getBoundingClientRect();

        const scale = 2; // Alta calidad (escala 2)
        const relX = (qrRect.left - boxRect.left) * scale;
        const relY = (qrRect.top - boxRect.top) * scale;
        const relW = qrRect.width * scale;
        const relH = qrRect.height * scale;

        // Captura base inicial rápida mediante html2canvas
        const baseCanvas = await html2canvas(kanbanBox, { 
            scale: scale, 
            useCORS: true, 
            logging: false, 
            animated: false 
        });

        const labelWidth = 205.9; // Ancho ajustado a hoja carta
        const labelHeight = 88;
        const xPos = 5;
        const yOffset = 5;
        const spacing = 3;

        let countInPage = 0;
        const total = (end - start) + 1;

        // Crear canvas temporal para la generación ultrarrápida
        const frameCanvas = document.createElement('canvas');
        frameCanvas.width = baseCanvas.width;
        frameCanvas.height = baseCanvas.height;
        const ctx = frameCanvas.getContext('2d');

        // Div temporal fuera de pantalla pero renderizable para el QR
        const tempQrDiv = document.createElement('div');
        tempQrDiv.style.position = 'absolute';
        tempQrDiv.style.left = '-9999px';
        document.body.appendChild(tempQrDiv);

        for (let i = start; i <= end; i++) {
            const currentIdx = (i - start) + 1;

            // 1. Copiar plantilla base completa
            ctx.drawImage(baseCanvas, 0, 0);

            // 2. Blanquear área de la secuencia y QR
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(relX, relY, relW, relH);

            // 3. Dibujar Caja de Secuencia
            const seqBoxW = 85 * scale;
            const seqBoxH = 32 * scale;
            const seqBoxX = relX + (relW - seqBoxW) / 2;
            const seqBoxY = relY + 8 * scale;

            ctx.fillStyle = '#EEEEEE';
            ctx.fillRect(seqBoxX, seqBoxY, seqBoxW, seqBoxH);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1 * scale;
            ctx.strokeRect(seqBoxX, seqBoxY, seqBoxW, seqBoxH);

            ctx.fillStyle = '#000000';
            ctx.font = `bold ${20 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(i.toString(), seqBoxX + (seqBoxW / 2), seqBoxY + (seqBoxH / 2));

            // 4. Generar código QR
            tempQrDiv.innerHTML = "";
            new QRCode(tempQrDiv, {
                text: `${i}-${document.getElementById('pno').value}-${document.getElementById('sebango').value}`,
                width: 90 * scale,
                height: 90 * scale,
                correctLevel: QRCode.CorrectLevel.M
            });

            // Esperar ciclo de render de JS para que se pinte el canvas/imagen QR
            await new Promise(resolve => setTimeout(resolve, 5));

            const qrCanvas = tempQrDiv.querySelector('canvas');
            const qrImg = tempQrDiv.querySelector('img');

            const qrX = relX + (relW - (90 * scale)) / 2;
            const qrY = seqBoxY + seqBoxH + (10 * scale);

            if (qrCanvas && qrCanvas.width > 0) {
                ctx.drawImage(qrCanvas, qrX, qrY, 90 * scale, 90 * scale);
            } else if (qrImg) {
                if (!qrImg.complete) {
                    await new Promise(resolve => {
                        qrImg.onload = resolve;
                        qrImg.onerror = resolve;
                    });
                }
                ctx.drawImage(qrImg, qrX, qrY, 90 * scale, 90 * scale);
            }

            // 5. Agregar a la hoja PDF
            if (countInPage === 3) {
                pdf.addPage();
                countInPage = 0;
            }

            const imgData = frameCanvas.toDataURL('image/jpeg', 0.92);
            const yPos = yOffset + (countInPage * (labelHeight + spacing));

            pdf.addImage(imgData, 'JPEG', xPos, yPos, labelWidth, labelHeight);
            countInPage++;

            // Actualizar progreso
            if (currentIdx % 10 === 0 || currentIdx === total) {
                progressEl.innerText = `⚡ Generando etiqueta ${currentIdx} de ${total}...`;
                await new Promise(r => setTimeout(r, 0));
            }
        }

        tempQrDiv.remove();

        progressEl.innerText = "💾 Guardando archivo PDF...";
        pdf.save(`KTMEX_Labels_${start}_al_${end}.pdf`);

        btnPdf.disabled = false;
        progressEl.innerText = "✅ PDF tamaño Carta generado exitosamente";
        setTimeout(() => progressEl.innerText = "", 4000);
    }
</script>

</body>
</html>
